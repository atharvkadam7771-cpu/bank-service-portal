apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
        - name: bank
          image: bank-service-portal:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
