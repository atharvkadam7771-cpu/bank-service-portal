# Nagios configuration for Experiment 10
# Save as:
# /usr/local/nagios/etc/objects/bank.cfg

define host {
    use                     generic-host
    host_name               bank-server
    alias                   Bank Service Portal Host
    address                 127.0.0.1
}

define service {
    use                     generic-service
    host_name               bank-server
    service_description     Bank Service Portal
    check_command           check_http!-p 8080 -u /
}
